<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordSnap - Anagram Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const [iconHtml, setIconHtml] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const icon = window.lucide.icons[name];
                    setIconHtml(icon.toSvg({ 
                        width: size, height: size, class: className, 'stroke-width': 2 
                    }));
                }
            }, [name, size, className]);
            return <span dangerouslySetInnerHTML={{ __html: iconHtml }} className="inline-flex" />;
        };

        const App = () => {
            const [wordData, setWordData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [userInput, setUserInput] = useState('');
            const [currentAnagram, setCurrentAnagram] = useState(null);
            const [foundWords, setFoundWords] = useState(new Set());
            const [score, setScore] = useState(0);
            const [message, setMessage] = useState({ text: '', type: '' });

            // Paths for GitHub Pages
            const DATA_FILES = ['./subanagram8.txt', './subanagram9-15.txt'];

            useEffect(() => {
                const loadData = async () => {
                    try {
                        setLoading(true);
                        let combinedData = [];
                        for (const file of DATA_FILES) {
                            const response = await fetch(file);
                            if (!response.ok) throw new Error(`Could not find ${file}. Ensure filenames are exact.`);
                            const text = await response.text();
                            
                            const lines = text.split(/\r?\n/);
                            const parsed = lines
                                .filter(line => line.trim())
                                .map(line => {
                                    // Split by Tab as seen in your file snippet
                                    const parts = line.split('\t');
                                    return { 
                                        word: (parts[0] || '').trim().toUpperCase(),
                                        id: parts[3] || ''
                                    };
                                })
                                .filter(item => item.word && item.word.length > 2);
                            
                            combinedData = [...combinedData, ...parsed];
                        }

                        if (combinedData.length === 0) throw new Error("Word list is empty.");
                        setWordData(combinedData);
                        setLoading(false);
                    } catch (err) {
                        setError(err.message);
                        setLoading(false);
                    }
                };
                loadData();
            }, []);

            const startNewGame = useCallback(() => {
                if (wordData.length === 0) return;
                const randomEntry = wordData[Math.floor(Math.random() * wordData.length)];
                setCurrentAnagram(randomEntry);
                setFoundWords(new Set());
                setUserInput('');
                setMessage({ text: 'Find the hidden word!', type: 'info' });
            }, [wordData]);

            useEffect(() => {
                if (!loading && wordData.length > 0 && !currentAnagram) startNewGame();
            }, [loading, wordData, currentAnagram, startNewGame]);

            const handleCheck = (e) => {
                e.preventDefault();
                const input = userInput.trim().toUpperCase();
                if (!input || !currentAnagram) return;

                if (input === currentAnagram.word) {
                    if (foundWords.has(input)) {
                        setMessage({ text: 'Already found!', type: 'warning' });
                    } else {
                        setFoundWords(prev => new Set([...prev, input]));
                        setScore(prev => prev + input.length * 10);
                        setMessage({ text: 'Correct! You found it!', type: 'success' });
                    }
                } else {
                    setMessage({ text: 'Not quite right!', type: 'error' });
                }
                setUserInput('');
            };

            if (loading) return (
                <div className="flex flex-col items-center justify-center min-h-screen">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                    <p className="text-slate-600 font-medium">Loading Words...</p>
                </div>
            );

            if (error) return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center">
                    <div className="text-red-500 mb-4 text-5xl">⚠️</div>
                    <h1 className="text-xl font-bold text-slate-800">Error Loading Data</h1>
                    <p className="text-slate-600 mt-2">{error}</p>
                    <p className="text-sm text-slate-400 mt-4 italic">Check that filenames on GitHub match exactly (lowercase/uppercase matter).</p>
                </div>
            );

            return (
                <div className="min-h-screen p-4 md:p-8 bg-slate-50">
                    <div className="max-w-2xl mx-auto">
                        <header className="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h1 className="text-2xl font-black text-blue-600">WORD<span className="text-slate-400">SNAP</span></h1>
                            <div className="text-right">
                                <div className="text-xs font-bold text-slate-400 uppercase">Score</div>
                                <div className="text-2xl font-black text-slate-800">{score}</div>
                            </div>
                        </header>

                        <main className="space-y-6">
                            <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center">
                                <div className="mb-8">
                                    <div className="flex flex-wrap justify-center gap-2">
                                        {currentAnagram?.word.split('').sort(() => Math.random() - 0.5).map((char, i) => (
                                            <span key={i} className="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center bg-blue-50 text-blue-700 text-xl md:text-2xl font-black rounded-xl border-b-4 border-blue-200 uppercase">
                                                {char}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                <form onSubmit={handleCheck} className="relative max-w-md mx-auto">
                                    <input 
                                        type="text"
                                        value={userInput}
                                        onChange={(e) => setUserInput(e.target.value)}
                                        placeholder="Solve the anagram..."
                                        className="w-full px-6 py-4 bg-slate-100 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-2xl text-lg font-bold outline-none pr-16 transition-all"
                                    />
                                    <button type="submit" className="absolute right-2 top-2 bottom-2 px-4 bg-blue-600 text-white rounded-xl">
                                        <Icon name="CheckCircle2" size={20} />
                                    </button>
                                </form>

                                {message.text && (
                                    <div className={`mt-4 text-xs font-bold py-2 px-4 rounded-lg inline-block ${
                                        message.type === 'success' ? 'bg-green-100 text-green-700' : 
                                        message.type === 'error' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'
                                    }`}>
                                        {message.text}
                                    </div>
                                )}
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-400 uppercase text-[10px] tracking-widest mb-4">Correct Guesses</h3>
                                <div className="flex flex-wrap gap-2">
                                    {Array.from(foundWords).map(word => (
                                        <span key={word} className="px-3 py-1 bg-green-50 text-green-700 rounded-lg font-bold border border-green-100 text-sm">
                                            {word}
                                        </span>
                                    ))}
                                    {foundWords.size === 0 && <p className="text-slate-300 italic text-sm">Solve the puzzle to see words here!</p>}
                                </div>
                            </div>

                            <button onClick={startNewGame} className="w-full py-3 flex items-center justify-center gap-2 text-slate-400 hover:text-blue-600 font-bold transition-colors text-sm">
                                <Icon name="RefreshCw" size={16} />
                                New Puzzle
                            </button>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
