<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Mastery</title>
    <link rel="icon" href="data:,">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        #root { min-height: 100vh; display: block; }
        #global-error { display: none; padding: 20px; color: red; font-family: monospace; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="global-error"></div>
    <div id="root"></div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('global-error').style.display = 'block';
            document.getElementById('global-error').innerHTML = 
                '<h2>Critical Error:</h2><p>' + message + '</p><p>Check the browser console for details.</p>';
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const Icon = ({ name, className = "", strokeWidth = 2, fill = "none" }) => {
            const icons = {
                Play: <polygon points="5 3 19 12 5 21 5 3" />,
                Check: <polyline points="20 6 9 17 4 12" />,
                X: <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>,
                RotateCcw: <><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></>,
                Home: <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></>,
                AlertCircle: <><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></>,
                Trophy: <><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2z" /></>,
                Timer: <><line x1="10" y1="2" x2="14" y2="2" /><line x1="12" y1="14" x2="15" y2="11" /><circle cx="12" cy="14" r="8" /></>,
                Skull: <><circle cx="9" cy="12" r="1" /><circle cx="15" cy="12" r="1" /><path d="M8 20v2h8v-2" /><path d="M12.5 17l-.5-1-.5 1h1z" /><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20" /></>,
                Star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
                ArrowRight: <><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></>,
                Loader2: <path d="M21 12a9 9 0 1 1-6.219-8.56" />,
                Gavel: <><path d="M14 13.5V16.5l-4 4" /><path d="M9.7 10.3L13.5 14l-2.8 2.8-3.7-3.7 2.7-2.8z" /><path d="M16 11l-4-4" /><path d="M10 6l4-4 8 8-4 4-8-8z" />,
                Scale: <><path d="M12 3v18" /><path d="M3 9h18" /><path d="M3 15h18" /><circle cx="6" cy="12" r="2" /><circle cx="18" cy="12" r="2" /></>      
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const ScrabbleApp = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [dictionary, setDictionary] = useState([]);
            const [dictSet, setDictSet] = useState(new Set());
            const [loading, setLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);
            const [mistakes, setMistakes] = useState([]);
            const [leaderboard, setLeaderboard] = useState({ timed: [], suddenDeath: [] });
            const [quizSettings, setQuizSettings] = useState({ length: 7, numQuestions: 10, type: 'A', prefixFilter: '', isTimed: false, isSuddenDeath: false });
            const [currentQuiz, setCurrentQuiz] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [flashColor, setFlashColor] = useState(null);
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [quizAInputs, setQuizAInputs] = useState([]);
            const [quizACurrentInput, setQuizACurrentInput] = useState('');
            const [quizAMistakeMade, setQuizAMistakeMade] = useState(false);
            const [quizAShowingAnswers, setQuizAShowingAnswers] = useState(false);
            const [judgeInput, setJudgeInput] = useState('');
            const [judgeResult, setJudgeResult] = useState(null);

            useEffect(() => {
                async function loadWordLists() {
                    try {
                        const files = ['./subanagram8.txt', './subanagram9-15.txt'];
                        const allWords = [];
                        const newDictSet = new Set();
                        for (const file of files) {
                            const response = await fetch(file, { cache: "no-store" });
                            if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load ${file}`);
                            const text = await response.text();
                            if (text.trim().startsWith('<!DOCTYPE html>') || text.trim().startsWith('<html')) {
                                throw new Error(`GitHub Pages returned an HTML page instead of the text file for "${file}".`);
                            }
                            const lines = text.split('\n');
                            lines.forEach(line => {
                                const parts = line.trim().split('\t');
                                if (parts.length >= 1) {
                                    const word = parts[0].toUpperCase().trim();
                                    if (word && /^[A-Z]+$/.test(word)) {
                                        allWords.push({ word });
                                        newDictSet.add(word);
                                    }
                                }
                            });
                        }
                        if (allWords.length === 0) throw new Error("Files loaded but no valid words found.");
                        setDictionary(allWords);
                        setDictSet(newDictSet);
                        setLoading(false);
                    } catch (err) {
                        setLoadError(err.message);
                        setLoading(false);
                    }
                }
                loadWordLists();
            }, []);

            const triggerFlash = (color) => {
                setFlashColor(color);
                setTimeout(() => setFlashColor(null), 500);
            };

            const shuffleArray = (array) => {
                const newArr = [...array];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            };

            const generateInvalidWord = (validWord) => {
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                let invalidWord = validWord;
                let attempts = 0;
                while (dictSet.has(invalidWord) && attempts < 50) {
                    const pos = Math.floor(Math.random() * validWord.length);
                    const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                    invalidWord = validWord.substring(0, pos) + randomChar + validWord.substring(pos + 1);
                    attempts++;
                }
                return invalidWord;
            };

            const handleGameOver = useCallback(() => {
                setTimerActive(false);
                if (quizSettings.type === 'A' && quizSettings.isTimed) {
                    setLeaderboard(prev => ({
                        ...prev,
                        timed: [...prev.timed, { score, date: new Date().toLocaleDateString() }].sort((a,b) => b.score - a.score).slice(0, 10)
                    }));
                } else if (quizSettings.type === 'B' && quizSettings.isSuddenDeath) {
                    setLeaderboard(prev => ({
                        ...prev,
                        suddenDeath: [...prev.suddenDeath, { score, date: new Date().toLocaleDateString() }].sort((a,b) => b.score - a.score).slice(0, 10)
                    }));
                }
                setCurrentScreen('gameOver');
            }, [score, quizSettings]);

            useEffect(() => {
                let interval = null;
                if (timerActive && timeLeft > 0 && !quizAShowingAnswers) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) { handleGameOver(); return 0; }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (timerActive && timeLeft <= 0) {
                    handleGameOver();
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft, quizAShowingAnswers, handleGameOver]);

            const startQuiz = () => {
                const { length, numQuestions, type, prefixFilter, isTimed, isSuddenDeath } = quizSettings;
                let questions = [];
                const prefix = prefixFilter.toUpperCase().trim();
                let filteredDict = dictionary.filter(w => w.word.length === length);
                if (prefix) filteredDict = filteredDict.filter(w => w.word.startsWith(prefix));
                if (filteredDict.length === 0) {
                    alert(`No ${length}-letter words found matching your criteria.`);
                    return;
                }
                if (type === 'A') {
                    const groups = {};
                    filteredDict.forEach(w => {
                        const sorted = w.word.split('').sort().join('');
                        if (!groups[sorted]) groups[sorted] = [];
                        groups[sorted].push(w.word);
                    });
                    const validGroups = Object.keys(groups);
                    const selectedGroups = shuffleArray(validGroups);
                    const limit = isTimed ? selectedGroups.length : Math.min(numQuestions, selectedGroups.length);
                    questions = selectedGroups.slice(0, limit).map(rack => ({
                        type: 'A',
                        rack: shuffleArray(rack.split('')).join(''),
                        validWords: groups[rack]
                    }));
                    if (isTimed) { setTimeLeft(60); setTimerActive(true); }
                } else {
                    const limit = isSuddenDeath ? filteredDict.length : Math.min(numQuestions, filteredDict.length);
                    for (let i = 0; i < limit; i++) {
                        const isActuallyValid = Math.random() > 0.5;
                        const randomValidWord = filteredDict[Math.floor(Math.random() * filteredDict.length)].word;
                        if (isActuallyValid) {
                            questions.push({ type: 'B', word: randomValidWord, isValid: true });
                        } else {
                            questions.push({ type: 'B', word: generateInvalidWord(randomValidWord), isValid: false });
                        }
                    }
                }
                setScore(0);
                setCurrentQuiz(questions);
                setCurrentQuestionIndex(0);
                setQuizAInputs([]);
                setQuizACurrentInput('');
                setQuizAMistakeMade(false);
                setQuizAShowingAnswers(false);
                setCurrentScreen(type === 'A' ? 'quizA' : 'quizB');
            };

            const startRetake = () => {
                if (mistakes.length === 0) return;
                setCurrentQuiz(shuffleArray([...mistakes]));
                setCurrentQuestionIndex(0);
                setScore(0);
                setQuizAInputs([]);
                setQuizACurrentInput('');
                setQuizAMistakeMade(false);
                setQuizAShowingAnswers(false);
                setTimerActive(false);
                setCurrentScreen('retake');
            };

            const handleQuizASubmit = (e) => {
                e.preventDefault();
                if (quizAShowingAnswers) return;
                const guess = quizACurrentInput.toUpperCase().trim();
                if (!guess) return;
                const currentQ = currentQuiz[currentQuestionIndex];
                if (currentQ.validWords.includes(guess) && !quizAInputs.includes(guess)) {
                    const newInputs = [...quizAInputs, guess];
                    setQuizAInputs(newInputs);
                    setQuizACurrentInput('');
                    if (newInputs.length === currentQ.validWords.length) {
                        triggerFlash('green');
                        if (quizSettings.type === 'A' && quizSettings.isTimed && currentScreen !== 'retake') {
                            setTimeLeft(prev => prev + 10);
                            setScore(prev => prev + 1);
                        } else if (!quizAMistakeMade && currentScreen !== 'retake') {
                            setScore(prev => prev + 1);
                        }
                        setTimeout(() => advanceQuestion(currentQ, true), 600);
                    } else {
                        triggerFlash('green');
                    }
                } else {
                    triggerFlash('red');
                    setQuizAMistakeMade(true);
                    setQuizACurrentInput('');
                    if (quizSettings.type === 'A' && quizSettings.isTimed && currentScreen !== 'retake') {
                        const newTime = Math.max(0, timeLeft - 2);
                        setTimeLeft(newTime);
                        if (newTime <= 0) { handleGameOver(); return; }
                    }
                    if (!mistakes.some(m => m.rack === currentQ.rack)) {
                        setMistakes([...mistakes, { ...currentQ, id: Date.now() }]);
                    }
                }
            };

            const handleQuizAGiveUp = () => {
                const currentQ = currentQuiz[currentQuestionIndex];
                triggerFlash('red');
                setQuizAMistakeMade(true);
                if (!mistakes.some(m => m.rack === currentQ.rack)) {
                    setMistakes([...mistakes, { ...currentQ, id: Date.now() }]);
                }
                setQuizAShowingAnswers(true);
            };

            const handleQuizANext = () => {
                advanceQuestion(currentQuiz[currentQuestionIndex], false);
            };

            const handleQuizBAnswer = (userSaysValid) => {
                const currentQ = currentQuiz[currentQuestionIndex];
                const isCorrect = userSaysValid === currentQ.isValid;
                if (isCorrect) {
                    triggerFlash('green');
                    if (currentScreen !== 'retake') setScore(prev => prev + 1);
                    setTimeout(() => advanceQuestion(currentQ, true), 500);
                } else {
                    triggerFlash('red');
                    if (!mistakes.some(m => m.word === currentQ.word)) {
                        setMistakes([...mistakes, { ...currentQ, id: Date.now() }]);
                    }
                    if (quizSettings.type === 'B' && quizSettings.isSuddenDeath && currentScreen !== 'retake') {
                        setTimeout(() => handleGameOver(), 500);
                    } else {
                        setTimeout(() => advanceQuestion(currentQ, false), 500);
                    }
                }
            };

            const advanceQuestion = (currentQ, wasCorrect) => {
                if (currentScreen === 'retake' && wasCorrect && !quizAMistakeMade) {
                    setMistakes(prev => prev.filter(m => {
                        if (currentQ.type === 'A') return m.rack !== currentQ.rack;
                        return m.word !== currentQ.word;
                    }));
                }
                if (currentQuestionIndex + 1 < currentQuiz.length) {
                    setCurrentQuestionIndex(currentQuestionIndex + 1);
                    setQuizAInputs([]);
                    setQuizACurrentInput('');
                    setQuizAMistakeMade(false);
                    setQuizAShowingAnswers(false);
                } else {
                    const isSurvival = (quizSettings.type === 'A' && quizSettings.isTimed) || (quizSettings.type === 'B' && quizSettings.isSuddenDeath);
                    if (currentScreen === 'retake') setCurrentScreen('home');
                    else if (isSurvival) handleGameOver();
                    else setCurrentScreen('result');
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!Input.trim()) return;
                const words = Input.toUpperCase().trim().split(/\s+/);
                const isValid = words.every(w => dictSet.has(w));
                setResult(isValid ? 'acceptable' : 'unacceptable');
            };

            const renderHome = () => (
                <div className="flex flex-col items-center justify-center space-y-6 animate-in fade-in duration-500">
                    <h1 className="text-5xl font-black text-slate-800 mb-2 tracking-tight text-center">Scrabble Mastery</h1>
                    {loadError ? (
                        <div className="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 max-w-lg text-center">
                            <p className="font-bold mb-2">Failed to load dictionaries:</p>
                            <p className="text-sm">{loadError}</p>
                        </div>
                    ) : loading ? (
                        <div className="flex items-center space-x-2 text-blue-600 font-medium">
                            <Icon name="Loader2" className="w-5 h-5 animate-spin" />
                            <span>Optimizing word lists...</span>
                        </div>
                    ) : (
                        <p className="text-slate-600 font-medium mb-4">Ready with {dictionary.length.toLocaleString()} words.</p>
                    )}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl">
                        <button onClick={() => setCurrentScreen('setup')} disabled={loading || loadError} className={`flex flex-col items-center justify-center p-8 rounded-2xl shadow-sm border transition-all group ${loading || loadError ? 'bg-slate-50 border-slate-200 opacity-50 cursor-not-allowed' : 'bg-white border-slate-200 hover:border-blue-500 hover:shadow-md'}`}>
                            <Icon name="Play" className={`w-12 h-12 mb-3 ${loading || loadError ? 'text-slate-300' : 'text-blue-500 group-hover:scale-110 transition-transform'}`} />
                            <span className="font-bold text-slate-700 text-lg">Start Practice</span>
                        </button>
                        <button onClick={() => { setJudgeInput(''); setJudgeResult(null); setCurrentScreen('judge'); }} disabled={loading || loadError} className={`flex flex-col items-center justify-center p-8 rounded-2xl shadow-sm border transition-all group ${loading || loadError ? 'bg-slate-50 border-slate-200 opacity-50 cursor-not-allowed' : 'bg-white border-slate-200 hover:border-indigo-500 hover:shadow-md'}`}>
                            <Icon name="Gavel" className={`w-12 h-12 mb-3 ${loading || loadError ? 'text-slate-300' : 'text-indigo-500 group-hover:scale-110 transition-transform'}`} />
                            <span className="font-bold text-slate-700 text-lg">Word Judge</span>
                        </button>
                        <button onClick={startRetake} disabled={mistakes.length === 0} className={`flex flex-col items-center justify-center p-6 rounded-2xl shadow-sm border transition-all group ${mistakes.length === 0 ? 'bg-slate-50 border-slate-200 opacity-50 cursor-not-allowed' : 'bg-white border-slate-200 hover:border-orange-500 hover:shadow-md'}`}>
                            <Icon name="RotateCcw" className={`w-10 h-10 mb-2 ${mistakes.length === 0 ? 'text-slate-300' : 'text-orange-500 group-hover:rotate-[-45deg] transition-transform'}`} />
                            <span className="font-bold text-slate-700">Retake Mistakes ({mistakes.length})</span>
                        </button>
                        <button onClick={() => setCurrentScreen('leaderboard')} className="flex flex-col items-center justify-center p-6 bg-white rounded-2xl shadow-sm border border-slate-200 hover:border-purple-500 hover:shadow-md transition-all group">
                            <Icon name="Trophy" className="w-10 h-10 text-purple-500 mb-2 group-hover:scale-110 transition-transform" />
                            <span className="font-bold text-slate-700">Rankings</span>
                        </button>
                    </div>
                </div>
            );

            const renderSetup = () => (
                <div className="flex flex-col max-w-md mx-auto w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200 animate-in zoom-in duration-300">
                    <h2 className="text-2xl font-black text-slate-800 mb-6 border-b pb-4">Quiz Setup</h2>
                    <div className="space-y-6">
                        <div>
                            <label className="block text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Mode</label>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={() => setQuizSettings({...quizSettings, type: 'A'})} className={`py-3 px-4 rounded-xl border-2 transition-all ${quizSettings.type === 'A' ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold' : 'bg-white border-slate-100 text-slate-500'}`}>Anagrams</button>
                                <button onClick={() => setQuizSettings({...quizSettings, type: 'B'})} className={`py-3 px-4 rounded-xl border-2 transition-all ${quizSettings.type === 'B' ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold' : 'bg-white border-slate-100 text-slate-500'}`}>Validity</button>
                            </div>
                        </div>
                        <div>
                            <div className="flex justify-between items-center mb-2">
                                <label className="block text-sm font-bold text-slate-500 uppercase tracking-wider">Word Length</label>
                                <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-black">{quizSettings.length} Letters</span>
                            </div>
                            <input type="range" min="2" max="15" value={quizSettings.length} onChange={(e) => setQuizSettings({...quizSettings, length: parseInt(e.target.value)})} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Starts With (Optional)</label>
                            <input type="text" maxLength={quizSettings.length} placeholder="e.g. TRA" value={quizSettings.prefixFilter} onChange={(e) => setQuizSettings({...quizSettings, prefixFilter: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none uppercase font-mono text-lg" />
                        </div>
                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                            {quizSettings.type === 'A' ? (
                                <div className="flex items-center">
                                    <input type="checkbox" id="timedMode" checked={quizSettings.isTimed} onChange={(e) => setQuizSettings({...quizSettings, isTimed: e.target.checked})} className="w-5 h-5 text-blue-600 rounded cursor-pointer" />
                                    <label htmlFor="timedMode" className="ml-3 flex items-center text-sm font-bold text-slate-700 cursor-pointer"><Icon name="Timer" className="w-4 h-4 mr-1 text-blue-500" /> Timed Survival</label>
                                </div>
                            ) : (
                                <div className="flex items-center">
                                    <input type="checkbox" id="suddenDeath" checked={quizSettings.isSuddenDeath} onChange={(e) => setQuizSettings({...quizSettings, isSuddenDeath: e.target.checked})} className="w-5 h-5 text-red-600 rounded cursor-pointer" />
                                    <label htmlFor="suddenDeath" className="ml-3 flex items-center text-sm font-bold text-slate-700 cursor-pointer"><Icon name="Skull" className="w-4 h-4 mr-1 text-red-500" /> Sudden Death</label>
                                </div>
                            )}
                        </div>
                        {!(quizSettings.type === 'A' && quizSettings.isTimed) && !(quizSettings.type === 'B' && quizSettings.isSuddenDeath) && (
                            <div>
                                <label className="block text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Quantity</label>
                                <select value={quizSettings.numQuestions} onChange={(e) => setQuizSettings({...quizSettings, numQuestions: parseInt(e.target.value)})} className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 outline-none font-bold text-slate-700">
                                    <option value={5}>5 Questions</option>
                                    <option value={10}>10 Questions</option>
                                    <option value={20}>20 Questions</option>
                                    <option value={50}>50 Questions</option>
                                </select>
                            </div>
                        )}
                    </div>
                    <div className="mt-8 flex gap-3">
                        <button onClick={() => setCurrentScreen('home')} className="flex-1 py-3 px-4 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors">Cancel</button>
                        <button onClick={startQuiz} className="flex-[2] bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-xl font-black shadow-lg shadow-blue-200 transition-all flex items-center justify-center">GO <Icon name="Play" className="w-4 h-4 ml-2" fill="currentColor" /></button>
                    </div>
                </div>
            );

            const renderQuizA = () => {
                if (!currentQuiz.length) return null;
                const currentQ = currentQuiz[currentQuestionIndex];
                return (
                    <div className="flex flex-col items-center w-full max-w-2xl mx-auto animate-in slide-in-from-bottom-4 duration-500">
                        <div className="w-full flex justify-between items-center mb-8 px-4">
                            {quizSettings.type === 'A' && quizSettings.isTimed && currentScreen !== 'retake' ? (
                                <div className={`flex items-center text-2xl font-black transition-colors ${timeLeft < 10 ? 'text-red-600 animate-pulse' : 'text-blue-600'}`}>
                                    <Icon name="Timer" className="w-6 h-6 mr-2" /> {timeLeft}s
                                </div>
                            ) : (
                                <div className="bg-slate-200 px-4 py-1 rounded-full text-xs font-black text-slate-600">Q {currentQuestionIndex + 1} / {currentQuiz.length}</div>
                            )}
                            <div className="bg-green-100 text-green-700 px-4 py-1 rounded-full text-xs font-black">{quizAInputs.length} / {currentQ.validWords.length} FOUND</div>
                        </div>
                        <div className="flex flex-wrap justify-center gap-2 mb-10">
                            {currentQ.rack.split('').map((letter, i) => (
                                <div key={i} className="w-12 h-14 bg-[#fdf2d0] border-b-4 border-r-2 border-[#d9c58c] rounded-lg shadow-md flex items-center justify-center text-3xl font-black text-slate-800 relative">{letter}</div>
                            ))}
                        </div>
                        <form onSubmit={handleQuizASubmit} className="w-full mb-8 max-w-lg">
                            <input type="text" value={quizACurrentInput} onChange={(e) => setQuizACurrentInput(e.target.value.toUpperCase())} placeholder={quizAShowingAnswers ? "Results below..." : "Type word..."} disabled={quizAShowingAnswers} className="w-full text-center text-3xl p-5 border-4 border-slate-200 rounded-2xl focus:border-blue-500 focus:ring-8 focus:ring-blue-50 outline-none uppercase tracking-widest font-black placeholder:text-slate-300 disabled:bg-slate-50 transition-all shadow-inner" autoFocus />
                        </form>
                        <div className="w-full grid grid-cols-2 sm:grid-cols-3 gap-3 mb-10 p-6 bg-white rounded-3xl border-2 border-slate-100 shadow-xl min-h-[160px]">
                            {quizAInputs.map((word, i) => (
                                <div key={`found-${i}`} className="flex items-center justify-center p-3 bg-green-50 text-green-700 font-black rounded-xl border border-green-200 text-center animate-in zoom-in duration-300"><Icon name="Check" className="w-4 h-4 mr-2" /> {word}</div>
                            ))}
                            {quizAShowingAnswers && currentQ.validWords.filter(w => !quizAInputs.includes(w)).map((word, i) => (
                                <div key={`missed-${i}`} className="flex items-center justify-center p-3 bg-red-50 text-red-700 font-black rounded-xl border border-red-200 text-center animate-in zoom-in duration-300"><Icon name="X" className="w-4 h-4 mr-2" /> {word}</div>
                            ))}
                            {!quizAShowingAnswers && Array.from({ length: currentQ.validWords.length - quizAInputs.length }).map((_, i) => (
                                <div key={`empty-${i}`} className="p-3 bg-slate-50 text-slate-300 font-black rounded-xl border-2 border-slate-100 border-dashed text-center">?</div>
                            ))}
                        </div>
                        <div className="flex items-center space-x-4">
                            {quizAShowingAnswers ? (
                                <button onClick={handleQuizANext} className="bg-slate-800 hover:bg-black text-white py-4 px-10 rounded-2xl font-black shadow-xl transition-all transform hover:scale-105">Next Question</button>
                            ) : (
                                <button onClick={handleQuizAGiveUp} className="text-slate-400 hover:text-red-500 font-bold transition-colors underline decoration-2 underline-offset-4">Give up & Reveal</button>
                            )}
                            {quizSettings.isTimed && <div className="text-sm font-bold text-slate-400">Score: <span className="text-blue-600">{score}</span></div>}
                        </div>
                    </div>
                );
            };

            const renderQuizB = () => {
                if (!currentQuiz.length) return null;
                const currentQ = currentQuiz[currentQuestionIndex];
                return (
                    <div className="flex flex-col items-center w-full max-w-md mx-auto animate-in zoom-in duration-500">
                        <div className="w-full flex justify-between items-center mb-10">
                            {quizSettings.type === 'B' && quizSettings.isSuddenDeath && currentScreen !== 'retake' ? (
                                <div className="flex items-center text-2xl font-black text-red-600"><Icon name="Skull" className="w-6 h-6 mr-2" /> {score}</div>
                            ) : (
                                <div className="bg-slate-200 px-4 py-1 rounded-full text-xs font-black text-slate-600">Q {currentQuestionIndex + 1} / {currentQuiz.length}</div>
                            )}
                        </div>
                        <h3 className="text-lg font-bold text-slate-400 uppercase tracking-widest mb-6">Word Challenge</h3>
                        <div className="text-4xl sm:text-5xl font-black tracking-[0.2em] text-slate-800 mb-12 bg-white px-10 py-10 rounded-[2.5rem] shadow-2xl border-4 border-slate-50 text-center w-full break-all">{currentQ.word}</div>
                        <div className="grid grid-cols-2 gap-6 w-full">
                            <button onClick={() => handleQuizBAnswer(true)} className="py-6 rounded-3xl font-black text-xl bg-white text-green-600 border-4 border-green-500 hover:bg-green-500 hover:text-white transition-all shadow-xl shadow-green-100 transform active:scale-95">VALID</button>
                            <button onClick={() => handleQuizBAnswer(false)} className="py-6 rounded-3xl font-black text-xl bg-white text-red-600 border-4 border-red-500 hover:bg-red-500 hover:text-white transition-all shadow-xl shadow-red-100 transform active:scale-95">INVALID</button>
                        </div>
                    </div>
                );
            };

            const renderResult = () => {
                const percentage = Math.round((score / currentQuiz.length) * 100);
                let feedback = percentage === 100 ? "Flawless mastery!" : percentage >= 80 ? "Grandmaster performance!" : percentage >= 50 ? "Solid progress!" : "Good effort!";
                return (
                    <div className="flex flex-col items-center justify-center text-center bg-white p-12 rounded-[3rem] shadow-2xl border border-slate-100 max-w-lg mx-auto w-full animate-in zoom-in duration-500">
                        <div className="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mb-8 ring-8 ring-yellow-50"><Icon name="Star" className="w-12 h-12 text-yellow-500" fill="currentColor" /></div>
                        <h2 className="text-4xl font-black text-slate-800 mb-2">Quiz Complete!</h2>
                        <p className="text-xl text-slate-400 font-medium mb-10">{feedback}</p>
                        <div className="bg-slate-50 rounded-3xl p-8 w-full mb-10 border border-slate-100">
                            <div className="text-sm font-black text-slate-400 uppercase mb-2">Your Score</div>
                            <p className="text-5xl font-black text-slate-800 mb-6"><span className="text-blue-600">{score}</span> <span className="text-slate-300 font-light">/</span> {currentQuiz.length}</p>
                            <div className="w-full bg-slate-200 rounded-full h-4 overflow-hidden shadow-inner">
                                <div className="bg-blue-500 h-4 rounded-full transition-all duration-1000 ease-out" style={{ width: `${percentage}%` }}></div>
                            </div>
                            <div className="text-right mt-2 text-xs font-black text-blue-600">{percentage}% Accuracy</div>
                        </div>
                        <div className="flex flex-col gap-4 w-full">
                            {mistakes.length > 0 && (
                                <button onClick={startRetake} className="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-orange-200 transition-all flex items-center justify-center text-lg"><Icon name="RotateCcw" className="w-5 h-5 mr-2" /> Review Mistakes ({mistakes.length})</button>
                            )}
                            <button onClick={() => setCurrentScreen('home')} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-4 rounded-2xl font-black transition-all flex items-center justify-center text-lg"><Icon name="Home" className="w-5 h-5 mr-2" /> Back to Home</button>
                        </div>
                    </div>
                );
            };

            const renderJudge = () => (
                <div className="flex flex-col items-center w-full max-w-xl mx-auto animate-in slide-in-from-top-10 duration-500">
                    <div className="flex flex-col items-center mb-10">
                        <div className="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mb-4"><Icon name="Gavel" className="w-8 h-8 text-indigo-600" /></div>
                        <h2 className="text-4xl font-black text-slate-800 tracking-tight">Word Judge</h2>
                        <p className="text-slate-400 font-medium mt-2">Instant Scrabble verification</p>
                    </div>
                    <form onSubmit={handleJudgeSubmit} className="w-full flex flex-col items-center">
                        <input type="text" value={judgeInput} onChange={(e) => { setJudgeInput(e.target.value); setJudgeResult(null); }} placeholder="ENTER WORD(S)..." className="w-full text-center text-3xl p-6 border-4 border-slate-100 rounded-[2rem] focus:border-indigo-500 focus:ring-8 focus:ring-indigo-50 outline-none uppercase tracking-[0.2em] font-black mb-8 shadow-inner transition-all" autoFocus />
                        <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white py-4 px-16 rounded-2xl font-black shadow-xl shadow-indigo-100 transition-all text-xl transform active:scale-95">CHECK WORDS</button>
                    </form>
                    {judgeResult && (
                        <div className={`mt-12 flex flex-col items-center p-10 rounded-[3rem] w-full animate-in zoom-in duration-300 ${judgeResult === 'acceptable' ? 'bg-green-50 border-4 border-green-200' : 'bg-red-50 border-4 border-red-200'}`}>
                            <h3 className={`text-3xl font-black mb-6 ${judgeResult === 'acceptable' ? 'text-green-700' : 'text-red-700'}`}>{judgeResult === 'acceptable' ? 'PLAY IS ACCEPTABLE' : 'PLAY IS UNACCEPTABLE'}</h3>
                            <Icon name={judgeResult === 'acceptable' ? "Check" : "X"} className={`w-32 h-32 ${judgeResult === 'acceptable' ? 'text-green-500' : 'text-red-500'}`} strokeWidth={4} />
                        </div>
                    )}
                </div>
            );

            const renderLeaderboard = () => (
                <div className="flex flex-col max-w-3xl mx-auto w-full bg-white p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 animate-in fade-in duration-500">
                    <h2 className="text-3xl font-black text-slate-800 mb-10 flex items-center border-b pb-6"><Icon name="Trophy" className="mr-4 text-yellow-500 w-10 h-10" /> Scrabble Hall of Fame</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div>
                            <h3 className="text-sm font-black text-blue-500 uppercase tracking-[0.2em] mb-6 flex items-center"><Icon name="Timer" className="w-5 h-5 mr-2" /> Timed Anagrams</h3>
                            {leaderboard.timed.length === 0 ? <p className="text-slate-300 font-medium italic">No entries yet.</p> : (
                                <ul className="space-y-3">
                                    {leaderboard.timed.map((entry, i) => (
                                        <li key={i} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 hover:bg-white hover:shadow-md transition-all">
                                            <div className="flex items-center">
                                                <span className={`w-8 h-8 rounded-full flex items-center justify-center font-black mr-3 text-xs ${i === 0 ? 'bg-yellow-400 text-white' : 'bg-slate-200 text-slate-500'}`}>{i + 1}</span>
                                                <span className="text-slate-400 text-xs font-bold">{entry.date}</span>
                                            </div>
                                            <span className="font-black text-blue-600 text-lg">{entry.score} pts</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                        <div>
                            <h3 className="text-sm font-black text-red-500 uppercase tracking-[0.2em] mb-6 flex items-center"><Icon name="Skull" className="w-5 h-5 mr-2" /> Sudden Death</h3>
                            {leaderboard.suddenDeath.length === 0 ? <p className="text-slate-300 font-medium italic">No entries yet.</p> : (
                                <ul className="space-y-3">
                                    {leaderboard.suddenDeath.map((entry, i) => (
                                        <li key={i} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 hover:bg-white hover:shadow-md transition-all">
                                            <div className="flex items-center">
                                                <span className={`w-8 h-8 rounded-full flex items-center justify-center font-black mr-3 text-xs ${i === 0 ? 'bg-yellow-400 text-white' : 'bg-slate-200 text-slate-500'}`}>{i + 1}</span>
                                                <span className="text-slate-400 text-xs font-bold">{entry.date}</span>
                                            </div>
                                            <span className="font-black text-red-600 text-lg">{entry.score} pts</span>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );

            const renderGameOver = () => (
                <div className="flex flex-col items-center justify-center text-center p-12 bg-white rounded-[3rem] shadow-2xl border-8 border-red-50 animate-in zoom-in duration-500 max-w-md mx-auto w-full">
                    <div className="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mb-8 ring-8 ring-red-50"><Icon name="Skull" className="w-12 h-12 text-red-600" /></div>
                    <h2 className="text-5xl font-black text-slate-800 mb-2 tracking-tighter">Time's Up!</h2>
                    <p className="text-xl text-slate-400 font-medium mb-10">Challenge ended.</p>
                    <div className="bg-slate-50 rounded-3xl p-8 w-full mb-10 text-center">
                        <div className="text-xs font-black text-slate-400 uppercase mb-1">Final Score</div>
                        <div className="text-6xl font-black text-blue-600">{score}</div>
                    </div>
                    <button onClick={() => setCurrentScreen('home')} className="w-full bg-slate-800 hover:bg-black text-white py-4 rounded-2xl font-black shadow-xl transition-all text-lg">Try Again</button>
                </div>
            );

            const getAppClasses = () => {
                let base = "min-h-screen flex flex-col items-center justify-center p-6 transition-all duration-500 border-[16px] ";
                if (flashColor === 'green') return base + "bg-green-50 border-green-400";
                if (flashColor === 'red') return base + "bg-red-50 border-red-400";
                return base + "bg-slate-50 border-white";
            };

            return (
                <div className={getAppClasses()}>
                    {currentScreen !== 'home' && currentScreen !== 'gameOver' && currentScreen !== 'result' && (
                        <div className="absolute top-10 left-10 z-10">
                            <button onClick={() => { setTimerActive(false); setCurrentScreen('home'); }} className="p-3 bg-white rounded-2xl shadow-lg border border-slate-100 text-slate-400 hover:text-blue-600 hover:border-blue-200 transition-all transform hover:scale-110 active:scale-90"><Icon name="Home" className="w-7 h-7" /></button>
                        </div>
                    )}
                    <div className="w-full max-w-5xl flex-1 flex flex-col justify-center relative">
                        {currentScreen === 'home' && renderHome()}
                        {currentScreen === 'setup' && renderSetup()}
                        {currentScreen === 'quizA' && renderQuizA()}
                        {currentScreen === 'quizB' && renderQuizB()}
                        {currentScreen === 'retake' && (currentQuiz[currentQuestionIndex]?.type === 'A' ? renderQuizA() : renderQuizB())}
                        {currentScreen === 'result' && renderResult()}
                        {currentScreen === 'judge' && renderJudge()}
                        {currentScreen === 'leaderboard' && renderLeaderboard()}
                        {currentScreen === 'gameOver' && renderGameOver()}
                    </div>
                    <div className="mt-8 text-center"><p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">Collins Scrabble Words Training Pro</p></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScrabbleApp />);
    </script>
</body>
</html>
